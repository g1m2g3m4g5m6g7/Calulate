name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init "Calculate" "com.example.calculate" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
